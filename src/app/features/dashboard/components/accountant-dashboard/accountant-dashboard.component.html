<div class="dashboard">
  <div class="dashboard-header" style="padding: 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
    <h1 style="font-size: 24px; font-weight: bold; color: #1e293b;">
      Accountant Dashboard
    </h1>
    <p style="color: #64748b;">Financial overview and budget usage across all projects.</p>
  </div>

  <section class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-header">
        <div class="kpi-icon-wrapper" style="background-color: #f0fdf4;">
          <mat-icon class="kpi-icon" style="color: #16a34a;">account_balance_wallet</mat-icon>
        </div>
      </div>
      <div class="kpi-title">TOTAL BUDGET USED</div>
      <div class="kpi-value">{{ budgetUsedPercentage() }}%</div>
      <div class="kpi-subtitle">Across all {{ totalProjects() }} Projects</div>
    </div>
  </section>
</div>
