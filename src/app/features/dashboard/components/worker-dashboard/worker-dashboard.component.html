<div class="dashboard">
  <div class="dashboard-header" style="padding: 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
    <h1 style="font-size: 24px; font-weight: bold; color: #1e293b;">
      Worker Dashboard
    </h1>
    <p style="color: #64748b;">Overview of your assigned daily tasks.</p>
  </div>

  <section class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-header">
        <div class="kpi-icon-wrapper" style="background-color: #fff7ed;">
          <mat-icon class="kpi-icon" style="color: #ea580c;">assignment</mat-icon>
        </div>
      </div>
      <div class="kpi-title">MY ACTIVE TASKS</div>
      <div class="kpi-value">{{ activeTasks() }}</div>
    </div>
    
    <div class="kpi-card">
      <div class="kpi-header">
        <div class="kpi-icon-wrapper" style="background-color: #f0fdf4;">
          <mat-icon class="kpi-icon" style="color: #16a34a;">done_all</mat-icon>
        </div>
      </div>
      <div class="kpi-title">COMPLETED TASKS</div>
      <div class="kpi-value">{{ completedTasks() }}</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-header">
        <div class="kpi-icon-wrapper" style="background-color: #fef2f2;">
          <mat-icon class="kpi-icon" style="color: #dc2626;">warning</mat-icon>
        </div>
        <span class="kpi-trend down">{{ overdueTasks() > 0 ? 'Critical' : 'Good' }}</span>
      </div>
      <div class="kpi-title">OVERDUE TASKS</div>
      <div class="kpi-value" [style.color]="overdueTasks() > 0 ? '#dc2626' : 'inherit'">{{ overdueTasks() }}</div>
    </div>
  </section>
</div>
