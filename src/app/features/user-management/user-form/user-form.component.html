<h2 mat-dialog-title class="dark:text-white">{{ isEditMode ? 'Edit User' : 'Add New User' }}</h2>
<mat-dialog-content class="pt-4 dark:text-gray-100">
    <form [formGroup]="userForm" class="flex flex-col gap-4 mt-2">
        <!-- Name -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="name" placeholder="John Doe">
            <mat-error *ngIf="userForm.get('name')?.hasError('required')">Name is required</mat-error>
            <mat-error *ngIf="userForm.get('name')?.hasError('minlength')">Name must be at least 3
                characters</mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" type="email" placeholder="john.doe@example.com">
            <mat-error *ngIf="userForm.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="userForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>

        <!-- Role -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>User Role</mat-label>
            <mat-select formControlName="role">
                <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
            </mat-select>
            <mat-error *ngIf="userForm.get('role')?.hasError('required')">Role is required</mat-error>
        </mat-form-field>

        <!-- Password (Only for Create) -->
        <mat-form-field appearance="outline" class="w-full" *ngIf="!isEditMode">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" placeholder="Ensure a strong password">
            <mat-error *ngIf="userForm.get('password')?.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="userForm.get('password')?.hasError('minlength')">Minimum 6 characters required</mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-4 pr-4">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" [disabled]="userForm.invalid" (click)="onSubmit()">
        {{ isEditMode ? 'Save Changes' : 'Create User' }}
    </button>
</mat-dialog-actions>
