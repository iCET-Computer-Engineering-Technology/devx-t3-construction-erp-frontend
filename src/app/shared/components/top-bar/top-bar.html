<header class="top-bar">
  <!-- Search -->
  <div class="search-container">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      class="search-input"
      [placeholder]="searchPlaceholder()"
      [value]="searchValue"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>

  <!-- Actions -->
  <div class="top-bar-actions">
    <!-- Notifications -->
    <button
      class="action-btn"
      matRipple
      [matRippleCentered]="true"
      [matRippleUnbounded]="true"
      [matRippleRadius]="20"
      (click)="onNotifications()"
      aria-label="Notifications"
    >
      @if (notificationCount() > 0) {
        <mat-icon matBadge="{{ notificationCount() }}" matBadgeColor="warn" matBadgeSize="small">
          notifications_none
        </mat-icon>
      } @else {
        <mat-icon>notifications_none</mat-icon>
      }
    </button>

    <!-- Messages -->
    <button
      class="action-btn"
      matRipple
      [matRippleCentered]="true"
      [matRippleUnbounded]="true"
      [matRippleRadius]="20"
      (click)="onMessages()"
      aria-label="Messages"
    >
      @if (messageCount() > 0) {
        <mat-icon matBadge="{{ messageCount() }}" matBadgeColor="warn" matBadgeSize="small">
          chat_bubble_outline
        </mat-icon>
      } @else {
        <mat-icon>chat_bubble_outline</mat-icon>
      }
    </button>

    <!-- Divider -->
    <div class="action-divider"></div>

    <!-- User Profile -->
    <button class="user-profile" matRipple (click)="onProfile()">
      @if (user(); as u) {
        <div class="user-info">
          <span class="user-name">{{ u.name }}</span>
          <span class="user-role">{{ u.role }}</span>
        </div>
        <div class="user-avatar">
          @if (u.avatarUrl) {
            <img [src]="u.avatarUrl" [alt]="u.name" class="avatar-img" />
          } @else {
            <span class="avatar-initials">{{ getUserInitials() }}</span>
          }
        </div>
      }
    </button>
  </div>
</header>
