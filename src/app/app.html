@if (isAuthPage()) {
  <router-outlet></router-outlet>
} @else {
  <div class="app-layout">
    <app-sidebar 
      [config]="sidebarConfig()" 
      [currentUser]="currentUser"
      (logoutClicked)="logout()"
    />
    <div class="app-main">
      <app-top-bar [user]="currentUser" />
      <div class="app-content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
}
