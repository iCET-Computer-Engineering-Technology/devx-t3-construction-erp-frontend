<div class="user-list-container p-6 bg-gray-50 dark:bg-gray-800 min-h-screen">
    <div class="header-section flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">User Management</h1>
        <button mat-flat-button color="primary" (click)="openUserForm()">
            <mat-icon>add</mat-icon> Add User
        </button>
    </div>

    <div class="table-container bg-white dark:bg-gray-900 shadow rounded-lg overflow-hidden">
        <div *ngIf="isLoading" class="p-8 text-center text-gray-500">
            Loading users...
        </div>

        <table mat-table [dataSource]="users" *ngIf="!isLoading" class="w-full">
            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="font-semibold"> Name </th>
                <td mat-cell *matCellDef="let user"> {{user.name}} </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef class="font-semibold"> Email </th>
                <td mat-cell *matCellDef="let user"> {{user.email}} </td>
            </ng-container>

            <!-- Role Column -->
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef class="font-semibold"> Role </th>
                <td mat-cell *matCellDef="let user">
                    <span class="text-xs font-mono bg-blue-100 text-blue-800 px-2 py-1 rounded">
                        {{user.role}}
                    </span>
                </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef class="font-semibold"> Status </th>
                <td mat-cell *matCellDef="let user">
                    <!-- Using Tailwind for badges, simple and matching Material chips conceptually -->
                    <span class="px-3 py-1 text-xs rounded-full font-medium"
                        [ngClass]="user.status === 'ACTIVE' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                        {{user.status}}
                    </span>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="font-semibold text-right"> Actions </th>
                <td mat-cell *matCellDef="let user" class="text-right">
                    <!-- Toggle Status -->
                    <button mat-icon-button title="Toggle Status" (click)="toggleStatus(user)">
                        <mat-icon [color]="user.status === 'ACTIVE' ? 'warn' : 'primary'">
                            {{ user.status === 'ACTIVE' ? 'block' : 'check_circle' }}
                        </mat-icon>
                    </button>
                    <!-- Edit User -->
                    <button mat-icon-button color="accent" title="Edit" (click)="openUserForm(user)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <!-- Delete User -->
                    <button mat-icon-button color="warn" title="Delete" (click)="deleteUser(user.userId)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200"></tr>

            <!-- No Data Row -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center p-4 italic text-gray-500" colspan="5">No users found.</td>
            </tr>
        </table>
    </div>
</div>
