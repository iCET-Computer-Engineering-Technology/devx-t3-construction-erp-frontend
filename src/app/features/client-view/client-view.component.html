<div class="flex items-center justify-center min-h-screen bg-gray-100 p-4 font-sans">
  
  <div *ngIf="!projectData && !errorMessage" class="flex flex-col items-center space-y-4">
    <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-600 border-opacity-50"></div>
    <p class="text-gray-600 font-medium text-lg">Loading project details...</p>
  </div>

  <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-8 rounded-lg shadow-lg max-w-md w-full text-center">
    <h2 class="text-red-700 text-2xl font-bold mb-2">Access Denied</h2>
    <p class="text-red-600 font-medium leading-relaxed">{{ errorMessage }}</p>
  </div>

  <div *ngIf="projectData" class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-lg w-full transform transition duration-500 hover:scale-105">
    
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6">
      <div class="flex justify-between items-start">
        <h1 class="text-white text-2xl font-extrabold tracking-tight">{{ projectData.projectName }}</h1>
        <span class="bg-green-400 text-green-900 px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest shadow-sm">
          {{ projectData.status }}
        </span>
      </div>
      <p class="text-blue-100 mt-2 text-sm font-medium flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        {{ projectData.location }}
      </p>
    </div>

    <div class="p-8 space-y-6">
      <div class="flex justify-between items-center text-gray-700">
        <span class="font-semibold text-sm uppercase tracking-wider text-gray-500">Estimated Completion</span>
        <span class="font-bold text-lg text-blue-900">{{ projectData.completionDate | date:'longDate' }}</span>
      </div>

      <div class="border-t border-gray-100 pt-4 text-gray-600 italic leading-relaxed">
        "{{ projectData.description }}"
      </div>
    </div>

    <div class="bg-gray-50 p-4 border-t border-gray-100 text-center">
      <p class="text-xs text-gray-400 font-semibold tracking-wide">Powered by DEVX Construction ERP</p>
    </div>

  </div>
</div>
